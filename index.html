<!--
THESIS: Rezerwacja u barbera jako natywna aplikacja iOS w przeglądarce — usługa, dzień, godzina, karnet w Wallet-stylu. Odrzuca landing z hero i formularzem kontaktowym oraz marketplace'owe listy Booksy.
OWN-WORLD: Tła grupowane #F2F2F7 / czarne w trybie ciemnym, listy inset, materiał pasków z rozmyciem, jedna sosnowa zieleń (#0E7A5E) tylko dla wyboru, głównej akcji i karnetu. SF Pro (Inter poza Apple), cyfry tabelaryczne.
STORY: Klient widzi salon i status otwarcia, wybiera usługę z ceną i czasem, przewija pasek dni, stuka godzinę, podaje imię i telefon w arkuszu, dostaje karnet i dodaje go do kalendarza.
FIRST VIEWPORT: Znak FORM3LA 40px z zieloną „3”, status „Otwarte do 19:00”, dwa przyciski-pigułki (Dojazd, Zadzwoń), a pod nimi lista usług z ceną po prawej — pierwsza usługa widoczna bez przewijania.
FORM: iOS Calendar + Wallet (przypięte w briefie; roll pominięty — brief wygrywa), seed dcd28fcd. Podniesienie od odrzuconego „monochrome product canon”: kolor marki użyty najwyżej 4 razy na ekran.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
